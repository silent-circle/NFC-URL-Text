<!DOCTYPE html>
<html>
<head>
  <link rel="icon" href="data:,">
  <title>NFC Viewer</title>
</head>
<body style="font-size:2.6em;font-family:sans-serif;padding:2em;white-space:pre-wrap">

<div id="nfctag">Showing Tag </div>

<script>
const COMMANDS = {
  'C': {
    vzip: true,
    copy: true,
    render: (text) => text + "\n\nCopied to Clipboard"
  },
  'L': {
    vzip:true,
    copy: false,
    render: (text) => "Please Find Here my contact information for my bag:\n\n" + text
  },
  'P': {
    vzip:true,
    copy: false,
    render: (text) =>  text
  },
  'H': {
    vzip: false,
    copy: true,
    render: (text) => "Here is the Hash:\n\n" + text
  }
};

function copyToClipboardSafely(text) {
  
  try {
    const copyPromise = navigator.clipboard.writeText(text);
    if (copyPromise && typeof copyPromise.catch === "function") {
      copyPromise.catch((err) => console.warn("Clipboard copy failed:", err));
    }
  } catch (err) {
    console.warn("Clipboard copy failed:", err);
  }
}

function handleHash() {
  const outputEl = document.getElementById('nfctag');
  const raw = decodeURIComponent(location.hash.slice(1));
  document.getElementById('nfctag').textContent=decodeURIComponent(location.hash.slice(1))
  if (!raw) {
    outputEl.textContent = " Something Is Wrong...";
    return;
  }

  const cmdChar = raw.charAt(0);
  const text = raw.slice(1);
  const cmd = COMMANDS[cmdChar];

  if (!cmd) {
    outputEl.textContent = raw;
    return;
  }

  // Render immediately, never block on the clipboard call.
  if (cmd.vzip) {
    const utext=text.replaceAll('_',' ')
    outputEl.textContent = cmd.render(utext);
  } else {
    outputEl.textContent = cmd.render(text);
  }
  if (cmd.copy) {
    copyToClipboardSafely(text);
  }
}

handleHash();
</script>

</body>
</html>
